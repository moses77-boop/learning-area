<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>My test page</title>
  </head>
  <body>
    <form>
      <h1>Payment form</h1>
      <p>Please complete all required (*) fields.</p>
      <section>
        <h2> Contact information</h2>
        <fieldset>
          <legend>Title</legend>
          <ul>
            <li>
              <label for="title_1">
                <input type="radio" id="title_1" value="A">
                Ace
              </label>
            </li>
            <li>
              <label for="title_2">
                <input type="radio" id="title_2" value="K">
                King
              </label>
            </li>
            <li>
              <label for="title_3">
                <input type="radio" id="title_3" value="Q">
                Queen
              </label>
            </li>
          </ul>
        </fieldset>
        <p>
          <label for="name">Name *:</label>
          <input type="text" id="name" name="username" placeholder="username" required> 
        </p>
        <p>
          <label for="name">Email *:</label>
          <input type="email" id="email" name="user-email" placeholder="email" required>
        </p>
        <p>
          <label for="pwd">Password *:</label>
          <input type="password" id="pwd" name="password" placeholder="password" required>
        </p>
      </section>
      <section>
        <h2>Payment Information</h2>
        <p>
          <label for="card">
            <span>Card type:</span>
          </label>
          <select id="card" name="user-card">
            <option value="visa">Visa</option>
            <option value="mc">Mastercard</option>
            <option value="pp">Paypal</option>
          </select>
        </p>
        <p>
          <label for="number">Card number *:</label>
          <input type="tel" id="number" name="card number" required>
        </p>
        <P>
          <label for="expiration">Expiration date *:</label>
          <input type="date" id="expiration" required>
        </P>
        <section>
          <p>
            <button type="submit">Validate payment</button>
          </p>
        </section>
      </section>
    </form>
    <p>This is my page</p>
  </body>
</html>
